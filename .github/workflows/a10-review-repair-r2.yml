name: Stage exact-head A10 review repair r2

on:
  push:
    branches:
      - gpt56/issue-12-boss-subgraph-r2
    paths:
      - ".github/workflows/a10-review-repair-r2.yml"

permissions:
  contents: write

concurrency:
  group: a10-review-repair-r2
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact trigger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Verify isolated repair trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4c204004064249628e67d7d5d2b42bf2712f0c07"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/a10-review-repair-r2.yml"
          test -f .github/workflows/a10-review-repair.yml

      - name: Reapply bounded review repair with exact Graph types
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          source = Path(".github/workflows/a10-review-repair.yml").read_text().splitlines()
          start = source.index("      - name: Apply bounded review repair")
          run = source.index("        run: |", start)
          end = source.index("      - name: Generate exact dependency lock", run)
          block = []
          for line in source[run + 1 : end]:
              if line.startswith("          "):
                  block.append(line[10:])
              elif line:
                  raise SystemExit(f"unexpected repair-block indentation: {line!r}")
              else:
                  block.append("")
          Path("/tmp/apply-a10-review-repair.sh").write_text("\n".join(block) + "\n")
          PY
          bash /tmp/apply-a10-review-repair.sh
          python <<'PY'
          from pathlib import Path

          path = Path("packages/subgraph/src/utils.ts")
          text = path.read_text()
          old = "railSubscriptionEntityId(filecoinPay: Address, railId: BigInt)"
          new = "railSubscriptionEntityId(filecoinPay: Bytes, railId: BigInt)"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one generated rail-key signature")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Generate exact dependency lock
        working-directory: packages/subgraph
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate repaired package
        working-directory: packages/subgraph
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run test:unit
          npm run build
          npm run test:matchstick
          npm run benchmark

      - name: Publish staged candidate ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/a10-review-repair.yml \
            .github/workflows/a10-review-repair-r2.yml
          git add \
            .github/workflows/a10-subgraph.yml \
            packages/subgraph/package-lock.json \
            packages/subgraph/schema.graphql \
            packages/subgraph/src/account.ts \
            packages/subgraph/src/utils.ts \
            packages/subgraph/tests/a10.test.ts

          expected=$(cat <<'EOF'
          .github/workflows/a10-review-repair-r2.yml
          .github/workflows/a10-review-repair.yml
          .github/workflows/a10-subgraph.yml
          packages/subgraph/package-lock.json
          packages/subgraph/schema.graphql
          packages/subgraph/src/account.ts
          packages/subgraph/src/utils.ts
          packages/subgraph/tests/a10.test.ts
          EOF
          )
          actual=$(git diff --cached --name-only | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sed 's/^          //' | sort)"

          git commit -m "fix(subgraph): resolve exact-head A10 review findings"
          candidate=$(git rev-parse HEAD)
          auth_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_head=$(git ls-remote "$auth_url" refs/heads/gpt56/issue-12-boss-subgraph-r2 | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          test -z "$(git ls-remote "$auth_url" refs/heads/gpt56/a10-review-repair-candidate)"
          git push "$auth_url" "HEAD:refs/heads/gpt56/a10-review-repair-candidate"
          echo "Staged candidate: $candidate"
