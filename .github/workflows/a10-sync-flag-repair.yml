name: Qualify deferred-sync state repair

on:
  push:
    branches:
      - gpt56/issue-12-boss-subgraph-r2
    paths:
      - ".github/workflows/a10-sync-flag-repair.yml"

permissions:
  contents: write

concurrency:
  group: a10-sync-flag-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact trigger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Verify isolated trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4d9b6cdf16887757583aa36d749cf6f52e97d056"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/a10-sync-flag-repair.yml"

      - name: Apply exact state and regression repair
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          account = Path("packages/subgraph/src/account.ts")
          text = account.read_text()
          old = '''  subscription.resourceStatusHash = event.parameters[5].value.toBytes();
          subscription.save();
          '''
          new = '''  subscription.resourceStatusHash = event.parameters[5].value.toBytes();
          subscription.pauseRateUpdateDeferred = false;
          subscription.save();
          '''
          if text.count(old) != 1:
              raise SystemExit("account.ts no longer matches the reviewed exact head")
          account.write_text(text.replace(old, new, 1))

          tests = Path("packages/subgraph/tests/a10.test.ts")
          text = tests.read_text()
          old = '''  handleFixedBudgetToppedUp,
          handleSubscriptionActivated,
          '''
          new = '''  handleFixedBudgetToppedUp,
          handlePauseRateUpdateDeferred,
          handleRateSynchronized,
          handleSubscriptionActivated,
          '''
          if text.count(old) != 1:
              raise SystemExit("a10.test.ts imports no longer match the reviewed exact head")
          text = text.replace(old, new, 1)
          old = '''    assert.fieldEquals("Subscription", subscriptionId, "pausedEpoch", "110");
              assert.fieldEquals("Subscription", subscriptionId, "requiresAccountRead", "false");

              const resume = mockEvent(Fixtures.ACCOUNT, 3, 2);
          '''
          new = '''    assert.fieldEquals("Subscription", subscriptionId, "pausedEpoch", "110");
              assert.fieldEquals("Subscription", subscriptionId, "requiresAccountRead", "false");

              const deferred = mockEvent(Fixtures.ACCOUNT, 3, 2);
              deferred.parameters.push(fixedBytes("subscriptionId", Fixtures.SUBSCRIPTION));
              handlePauseRateUpdateDeferred(deferred);
              assert.fieldEquals("Subscription", subscriptionId, "pauseRateUpdateDeferred", "true");

              const sync = mockEvent(Fixtures.ACCOUNT, 3, 3);
              sync.parameters.push(fixedBytes("subscriptionId", Fixtures.SUBSCRIPTION));
              sync.parameters.push(unsigned("oldRate", BigInt.fromI32(25)));
              sync.parameters.push(unsigned("newRate", BigInt.zero()));
              sync.parameters.push(unsigned("quoteEpoch", BigInt.fromI32(115)));
              sync.parameters.push(unsigned("validThroughEpoch", BigInt.fromI32(140)));
              sync.parameters.push(fixedBytes("resourceStatusHash", Fixtures.RESOURCE_DATA));
              handleRateSynchronized(sync);
              assert.fieldEquals("Subscription", subscriptionId, "state", "PAUSED");
              assert.fieldEquals("Subscription", subscriptionId, "pauseRateUpdateDeferred", "false");
              assert.fieldEquals("Subscription", subscriptionId, "acceptedRatePerEpoch", "0");

              const resume = mockEvent(Fixtures.ACCOUNT, 3, 4);
          '''
          if text.count(old) != 1:
              raise SystemExit("a10.test.ts lifecycle block no longer matches the reviewed exact head")
          tests.write_text(text.replace(old, new, 1))
          PY

      - name: Validate complete A10 package
        working-directory: packages/subgraph
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run test:unit
          npm run build
          npm run test:matchstick
          npm run benchmark

      - name: Publish exact source repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/subgraph/src/account.ts packages/subgraph/tests/a10.test.ts
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' packages/subgraph/src/account.ts packages/subgraph/tests/a10.test.ts | sort)"
          git commit -m "fix(subgraph): clear resolved deferred sync state"
          auth_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_head=$(git ls-remote "$auth_url" refs/heads/gpt56/issue-12-boss-subgraph-r2 | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git push "$auth_url" "HEAD:refs/heads/gpt56/issue-12-boss-subgraph-r2"
