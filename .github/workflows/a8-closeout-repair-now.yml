name: A8 closeout repair now

on:
  push:
    branches:
      - gpt56/issue-10-bundles-state-view-artifacts
    paths:
      - .github/workflows/a8-closeout-repair-now.yml

permissions:
  contents: write

concurrency:
  group: a8-closeout-repair-now
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/issue-10-bundles-state-view-artifacts
          fetch-depth: 0
          submodules: recursive

      - name: Verify Filecoin Pay source lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C lib/filecoin-pay rev-parse HEAD)" = "04ded6af6c15c4b5d98545f393dc656004d4aede"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - name: Apply bounded A8 repair
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/a8-closeout-size-fix.b64 > /tmp/a8-closeout-size-fix.py
          base64 -d .github/a8-closeout-final-size-fix.b64 > /tmp/a8-closeout-final-size-fix.py
          python3 .github/a8-closeout-repair.py
          python3 /tmp/a8-closeout-size-fix.py
          python3 /tmp/a8-closeout-final-size-fix.py

      - name: Format, build, and test
        shell: bash
        run: |
          set -euo pipefail
          forge fmt
          forge fmt --check
          forge build --sizes
          forge test -vvv

      - name: Regenerate deterministic artifacts
        shell: bash
        run: |
          set -euo pipefail
          scripts/generate-contract-artifacts.sh
          git diff --check

      - name: Commit candidate and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/a8-closeout-repair.py .github/a8-closeout-size-fix.b64 .github/a8-closeout-final-size-fix.b64 .github/workflows/a8-closeout-repair-now.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: complete A8 indexer and claim surface"
          git push origin HEAD:gpt56/issue-10-bundles-state-view-artifacts
