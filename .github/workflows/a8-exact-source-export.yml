name: Publish qualified A8 source candidate

on:
  push:
    branches:
      - gpt56/issue-10-bundles-state-view-artifacts
    paths:
      - .github/workflows/a8-exact-source-export.yml

permissions:
  contents: write

concurrency:
  group: a8-qualified-source-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.3.5
          cache: true

      - name: Verify and apply exact source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "c603fc0cedff60b36139842f2406fe666e729b88"
          test "$(git -C lib/filecoin-pay rev-parse HEAD)" = "04ded6af6c15c4b5d98545f393dc656004d4aede"
          cat \
            .github/a8-source-final-part-00.b64 \
            .github/a8-source-final-part-01.b64 \
            .github/a8-source-final-part-02a.b64 \
            .github/a8-source-final-part-02b.b64 \
            .github/a8-source-final-part-02c.b64 \
            .github/a8-source-final-part-03.b64 \
            .github/a8-source-final-part-04a.b64 \
            .github/a8-source-final-part-04b.b64 \
            | base64 -d | gzip -dc > /tmp/a8-source-final.patch
          echo "30fb8a26612815587cf7e3c795005f8e30f79c500f151a99e9fe37fdc7316018  /tmp/a8-source-final.patch" | sha256sum -c -
          git apply --check /tmp/a8-source-final.patch
          git apply /tmp/a8-source-final.patch
          rm -f .github/a8-source-final*
          rm .github/workflows/a8-exact-source-export.yml
          test -z "$(find .github -maxdepth 1 -type f -name 'a8-source-final*' -print -quit)"
          test ! -e .github/workflows/a8-exact-source-export.yml
          git diff --check

      - name: Qualify exact source tree
        shell: bash
        run: |
          set -euo pipefail
          forge fmt --check
          forge build --sizes
          forge test -vvv

      - name: Publish source-only commit
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add --all
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only | grep '^packages/contracts/' || true)"
          test -z "$(git diff --cached --name-only --diff-filter=ACMRTUXB | grep '^.github/a8-source-final' || true)"
          test -z "$(git diff --cached --name-only --diff-filter=ACMRTUXB | grep '^.github/workflows/a8-exact-source-export.yml$' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: complete authenticated A8 integration surface"
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:gpt56/issue-10-bundles-state-view-artifacts
