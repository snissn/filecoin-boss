name: Export qualified A8 candidate

on:
  push:
    branches:
      - gpt56/issue-10-bundles-state-view-artifacts
    paths:
      - .github/workflows/a8-export-qualified-candidate.yml

permissions:
  contents: read

concurrency:
  group: a8-export-qualified-candidate
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/issue-10-bundles-state-view-artifacts
          fetch-depth: 0
          submodules: recursive

      - name: Verify Filecoin Pay source lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C lib/filecoin-pay rev-parse HEAD)" = "04ded6af6c15c4b5d98545f393dc656004d4aede"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - name: Reproduce exact qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/a8-closeout-size-fix.b64 > /tmp/a8-closeout-size-fix.py
          base64 -d .github/a8-closeout-final-size-fix.b64 > /tmp/a8-closeout-final-size-fix.py
          python3 .github/a8-closeout-repair.py
          python3 /tmp/a8-closeout-size-fix.py
          python3 /tmp/a8-closeout-final-size-fix.py
          forge fmt
          forge fmt --check
          forge build --sizes
          forge test -vvv
          scripts/generate-contract-artifacts.sh
          git diff --check

      - name: Build exact candidate export
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/a8-closeout-repair.py \
            .github/a8-closeout-size-fix.b64 \
            .github/a8-closeout-final-size-fix.b64 \
            .github/sitecustomize.py \
            .github/pathlib.py \
            .github/workflows/a8-closeout-repair-now.yml \
            .github/workflows/a8-export-qualified-candidate.yml
          git add -A
          git diff --cached --check
          mkdir -p /tmp/a8-qualified
          git diff --cached --name-only --diff-filter=ACMRT -z \
            | tar --null -T - -czf /tmp/a8-qualified/files.tar.gz
          git diff --cached --name-only --diff-filter=D > /tmp/a8-qualified/deletions.txt
          git diff --cached --binary > /tmp/a8-qualified/candidate.patch
          git diff --cached --stat > /tmp/a8-qualified/stat.txt
          git diff --cached --name-status > /tmp/a8-qualified/name-status.txt
          git rev-parse HEAD > /tmp/a8-qualified/source-head.txt
          sha256sum /tmp/a8-qualified/* > /tmp/a8-qualified/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: a8-qualified-candidate
          path: /tmp/a8-qualified/
          if-no-files-found: error
          retention-days: 1
