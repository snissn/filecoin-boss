name: Publish A8 non-workflow source

on:
  push:
    branches:
      - gpt56/issue-10-bundles-state-view-artifacts
    paths:
      - .github/workflows/a8-final-source-publish.yml

permissions:
  contents: write

concurrency:
  group: a8-final-source-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact bootstrap parent and Filecoin Pay lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "0bf4715a7c129207e44e0e55829333e9806be21a"
          test "$(git -C lib/filecoin-pay rev-parse HEAD)" = "04ded6af6c15c4b5d98545f393dc656004d4aede"

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.3.5
          cache: true

      - name: Verify and apply exact non-workflow source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/a8-final-source-{00..04}.b64 .github/a8-final-source-05{a..d}.b64 | base64 --decode > /tmp/a8-source.patch.gz
          echo "f256ac1180a79d23943f47b524849209031e25ed94d79540836411bddb572276  /tmp/a8-source.patch.gz" | sha256sum -c -
          gzip -dc /tmp/a8-source.patch.gz > /tmp/a8-source.patch
          echo "68603770b852ad1ea63d8ba9cfbc6b77569db674758e820de7b0c88cdecc2bb2  /tmp/a8-source.patch" | sha256sum -c -
          git apply --check /tmp/a8-source.patch
          git apply /tmp/a8-source.patch
          rm -f .github/a8-final-source-*.b64

      - name: Qualify final non-workflow source tree
        shell: bash
        run: |
          set -euo pipefail
          forge fmt --check
          forge build --sizes | tee /tmp/a8-build-sizes.log
          grep -F '| BossAccount' /tmp/a8-build-sizes.log
          forge test -vvv
          git diff --check
          test -z "$(git status --short -- packages/contracts/abi packages/contracts/bytecode packages/contracts/artifacts.json)"

      - name: Publish clean non-workflow source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)"
          test -z "$(git diff --cached --name-only | grep -E '^packages/contracts/(abi/|bytecode/|artifacts\.json$)' || true)"
          git commit -m "feat: complete A8 atomic integration source"
          git push origin HEAD:gpt56/issue-10-bundles-state-view-artifacts
