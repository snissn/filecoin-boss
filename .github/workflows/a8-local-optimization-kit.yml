name: Publish qualified A8 source repair

on:
  push:
    branches:
      - gpt56/issue-10-bundles-state-view-artifacts
    paths:
      - .github/workflows/a8-local-optimization-kit.yml

permissions:
  contents: write

concurrency:
  group: a8-final-source-repair
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.3.5
          cache: true

      - name: Verify and apply bounded source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          observed="$(git -C lib/filecoin-pay rev-parse HEAD)"
          expected="04ded6af6c15c4b5d98545f393dc656004d4aede"
          if [ "$observed" != "$expected" ]; then
            echo "filecoin-pay lock mismatch: expected $expected, observed $observed" >&2
            exit 1
          fi

          cat .github/a8-final-repair-00.b64 \
              .github/a8-final-repair-01.b64 \
              .github/a8-final-repair-02.b64 \
            | base64 -d \
            | gzip -dc > /tmp/a8-final-repair.patch
          echo "42a84fd549856ccaa67a53b4087d521d9909f620da623bbd16b587f4df281ede  /tmp/a8-final-repair.patch" \
            | sha256sum -c -
          git apply --check /tmp/a8-final-repair.patch
          git apply /tmp/a8-final-repair.patch
          rm -f .github/a8-final-repair-00.b64 \
                .github/a8-final-repair-01.b64 \
                .github/a8-final-repair-02.b64
          git diff --check

      - name: Qualify exact source tree
        shell: bash
        run: |
          set -euo pipefail
          forge fmt --check
          forge build --sizes
          forge test -vvv

      - name: Publish source-only commit
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo "source publication unexpectedly modifies a workflow file" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: authenticate and complete A8 integration surface"
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:gpt56/issue-10-bundles-state-view-artifacts
