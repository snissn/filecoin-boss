name: Integrate current main into A8

on:
  push:
    branches:
      - gpt56/issue-10-bundles-state-view-artifacts
    paths:
      - .github/workflows/a8-merge-current-main.yml

permissions:
  contents: write

concurrency:
  group: a8-integrate-current-main
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.3.5
          cache: true

      - name: Construct exact two-parent integration tree
        shell: bash
        run: |
          set -euo pipefail
          branch_parent=20c7fb284eba4c697707d142d814cea75c045f33
          main_parent=43ce5e875289a4f644f2d3d74ddd4d72057ca91a
          test "$(git rev-parse HEAD^)" = "$branch_parent"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$main_parent"
          test "$(git -C lib/filecoin-pay rev-parse HEAD)" = "04ded6af6c15c4b5d98545f393dc656004d4aede"

          files=(
            README.md
            docs/FILECOIN_BOSS_DOCUMENT_SET_INDEX.md
            docs/FILECOIN_BOSS_HUMAN_SUMMARY_v0.1.md
            docs/FILECOIN_BOSS_IMPLEMENTATION_DRAFT_v0.1.md
            docs/FILECOIN_BOSS_SPEC_v0.2.md
            docs/FILECOIN_BOSS_TEST_AND_ROLLOUT_PLAN_v0.1.md
            docs/IMPLEMENTATION_ISSUE_GRAPH.md
          )
          sed -i 's/Filone/FilOne/g' "${files[@]}"
          rm .github/workflows/a8-merge-current-main.yml
          git diff --check
          test -z "$(grep -n 'Filone' "${files[@]}" || true)"

      - name: Qualify integrated source tree
        shell: bash
        run: |
          set -euo pipefail
          forge fmt --check
          forge build --sizes
          forge test -vvv

      - name: Publish two-parent source merge
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_parent=43ce5e875289a4f644f2d3d74ddd4d72057ca91a
          git add --all
          git diff --cached --check
          unexpected=$(git diff --cached --name-only | grep -vE '^(README\.md|docs/FILECOIN_BOSS_DOCUMENT_SET_INDEX\.md|docs/FILECOIN_BOSS_HUMAN_SUMMARY_v0\.1\.md|docs/FILECOIN_BOSS_IMPLEMENTATION_DRAFT_v0\.1\.md|docs/FILECOIN_BOSS_SPEC_v0\.2\.md|docs/FILECOIN_BOSS_TEST_AND_ROLLOUT_PLAN_v0\.1\.md|docs/IMPLEMENTATION_ISSUE_GRAPH\.md|\.github/workflows/a8-merge-current-main\.yml)$' || true)
          test -z "$unexpected"
          test ! -e .github/workflows/a8-merge-current-main.yml
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'Merge current main into A8 integration candidate' | git commit-tree "$tree" -p "$GITHUB_SHA" -p "$main_parent")
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "$commit":gpt56/issue-10-bundles-state-view-artifacts
