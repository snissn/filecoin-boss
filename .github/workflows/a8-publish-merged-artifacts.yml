name: Publish merged-source A8 contract artifacts

on:
  push:
    branches:
      - gpt56/issue-10-bundles-state-view-artifacts
    paths:
      - .github/workflows/a8-publish-merged-artifacts.yml

permissions:
  contents: write

concurrency:
  group: a8-publish-merged-artifacts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.3.5
          cache: true

      - name: Generate package from merged source authority
        shell: bash
        run: |
          set -euo pipefail
          source_commit=4a7bd35801ea6bc0521f942f48a9b7a713172bc0
          test "$(git rev-parse HEAD^)" = "$source_commit"
          test "$(git merge-base "$source_commit" HEAD)" = "$source_commit"
          test "$(git -C lib/filecoin-pay rev-parse HEAD)" = "04ded6af6c15c4b5d98545f393dc656004d4aede"
          git worktree add --detach /tmp/a8-merged-source "$source_commit"
          git -C /tmp/a8-merged-source submodule sync --recursive
          git -C /tmp/a8-merged-source submodule update --init --force --recursive
          test "$(git -C /tmp/a8-merged-source rev-parse HEAD)" = "$source_commit"
          (
            cd /tmp/a8-merged-source
            SOURCE_COMMIT="$source_commit" scripts/generate-contract-artifacts.sh
          )
          rsync -a --delete /tmp/a8-merged-source/packages/contracts/ packages/contracts/
          test "$(jq -er '.sourceCommit' packages/contracts/artifacts.json)" = "$source_commit"
          test "$(jq -er '.protocolCommit' packages/contracts/artifacts.json)" = "$source_commit"
          jq -e '.[] | select(.type == "function" and .name == "acceptBundle")' \
            packages/contracts/abi/BossAccount.json >/dev/null
          jq -e '.[] | select(.type == "function" and .name == "bundles")' \
            packages/contracts/abi/BossFactory.json >/dev/null
          jq -e '.[] | select(.type == "event" and .name == "SubscriptionAccepted")' \
            packages/contracts/abi/BossAccount.json >/dev/null
          rm .github/workflows/a8-publish-merged-artifacts.yml
          git diff --check

      - name: Publish generated-only commit
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add --all -- packages/contracts .github/workflows/a8-publish-merged-artifacts.yml
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          unexpected=$(git diff --cached --name-only | grep -vE '^(packages/contracts/|\.github/workflows/a8-publish-merged-artifacts\.yml$)' || true)
          test -z "$unexpected"
          test ! -e .github/workflows/a8-publish-merged-artifacts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerate A8 artifacts from merged source"
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:gpt56/issue-10-bundles-state-view-artifacts
