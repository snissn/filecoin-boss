name: A8 review repair export

on:
  push:
    branches:
      - gpt56/issue-10-bundles-state-view-artifacts
    paths:
      - .github/workflows/a8-review-repair-export.yml

permissions:
  contents: read

concurrency:
  group: a8-review-repair-export
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact trigger and Filecoin Pay source lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C lib/filecoin-pay rev-parse HEAD)" = "04ded6af6c15c4b5d98545f393dc656004d4aede"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - name: Apply, format, build, test, and regenerate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/a8-review-repair.py
          forge fmt
          forge fmt --check
          forge build --sizes
          forge test -vvv
          scripts/generate-contract-artifacts.sh
          git diff --check

      - name: Package exact qualified repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a8-review-repair
          tar -czf /tmp/a8-review-repair/files.tar.gz \
            .github/workflows/contract-artifacts.yml \
            src/BossAccount.sol \
            src/BossStateView.sol \
            test/unit/BossUsageClaims.t.sol \
            test/integration/A8LifecycleReconstruction.t.sol \
            packages/contracts
          git diff --binary -- \
            .github/workflows/contract-artifacts.yml \
            src/BossAccount.sol \
            src/BossStateView.sol \
            test/unit/BossUsageClaims.t.sol \
            test/integration/A8LifecycleReconstruction.t.sol \
            packages/contracts \
            > /tmp/a8-review-repair/qualified.patch
          git rev-parse HEAD > /tmp/a8-review-repair/source-head.txt
          cd /tmp/a8-review-repair
          sha256sum files.tar.gz qualified.patch source-head.txt > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: a8-review-repair-candidate
          path: /tmp/a8-review-repair/
          if-no-files-found: error
          retention-days: 1
