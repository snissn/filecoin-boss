name: A9 R1 generate qualified local manifest

on:
  push:
    branches:
      - gpt56/issue-11-devnet-calibration-deployment-r1
    paths:
      - ".github/workflows/a9-r1-bootstrap.yml"
      - ".github/workflows/deployment.yml"
      - "src/deployment/**"
      - "script/**"
      - "test/deployment/**"
      - "scripts/deploy-*.sh"
      - "scripts/finalize-deployment-manifest.py"
      - "scripts/validate-deployment-manifest.py"
      - "deployments/schema.json"
      - "foundry.toml"

permissions:
  contents: write

concurrency:
  group: a9-r1-bootstrap
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.3.5
          cache: false

      - name: Qualify exact source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C lib/filecoin-pay rev-parse HEAD)" = \
            04ded6af6c15c4b5d98545f393dc656004d4aede
          forge fmt --check
          forge build --sizes
          forge test --match-path 'test/deployment/*.t.sol' -vvv
          python3 -m py_compile \
            scripts/finalize-deployment-manifest.py \
            scripts/validate-deployment-manifest.py
          bash -n scripts/deploy-local-anvil.sh scripts/deploy-network.sh \
            scripts/deploy-devnet.sh scripts/deploy-calibration.sh

      - name: Generate receipt-backed local manifest
        shell: bash
        run: |
          set -euo pipefail
          BOSS_DEPLOYMENT_COMMIT="$GITHUB_SHA" \
          BOSS_MANIFEST_OUTPUT=deployments/devnet.json \
            scripts/deploy-local-anvil.sh
          python3 scripts/validate-deployment-manifest.py deployments/devnet.json \
            --expected-network devnet \
            --expected-deployment-commit "$GITHUB_SHA"

      - name: Record generated artifact and remove bootstrap workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/a9-r1-bootstrap.yml
          git add deployments/devnet.json
          printf '%s\n' \
            .github/workflows/a9-r1-bootstrap.yml \
            deployments/devnet.json > /tmp/expected-paths
          git diff --cached --name-only | sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deployment): record qualified local manifest" \
            -m "SOURCE_COMMIT: $GITHUB_SHA"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
