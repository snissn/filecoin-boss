name: Apply A6 account implementation once

on:
  push:
    branches:
      - gpt56/issue-8-pdp-capacity-pricing
    paths:
      - .github/apply-a6-once

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/issue-8-pdp-capacity-pricing
          fetch-depth: 0
          submodules: recursive

      - name: Apply capacity account implementation
        run: python .github/apply-a6.py

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - run: forge fmt

      - name: Commit implementation and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/apply-a6-once .github/apply-a6.py .github/workflows/apply-a6-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: implement prospective capacity pricing"
          git push origin HEAD:gpt56/issue-8-pdp-capacity-pricing
