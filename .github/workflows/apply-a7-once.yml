name: Apply A7 implementation once

on:
  push:
    branches:
      - gpt56/issue-9-capped-metered-services
    paths:
      - .github/apply-a7-once

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/issue-9-capped-metered-services
          fetch-depth: 0
          submodules: recursive

      - name: Apply bounded implementation
        shell: bash
        run: |
          set -euo pipefail
          cp .github/staging/CappedMeteredAdapter.sol src/adapters/pricing/CappedMeteredAdapter.sol
          python .github/scripts/apply_a7.py

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - name: Format implementation
        run: forge fmt

      - name: Commit implementation and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/apply-a7-once .github/workflows/apply-a7-once.yml .github/scripts .github/staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add capped trusted metering"
          git push origin HEAD:gpt56/issue-9-capped-metered-services
