name: Finalize Filecoin Boss document package

on:
  push:
    paths:
      - ".summary-repair/READY"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish and verify the exact human summary
        shell: bash
        run: |
          set -euo pipefail
          cat .summary-repair/*.b64part \
            | base64 --decode \
            | gzip --decompress \
            > docs/FILECOIN_BOSS_HUMAN_SUMMARY_v0.1.md

          printf '%s  %s\n' \
            'a66584a8885ebc8283ea5f017f1d26ea06891b01f36ab28e12233579ed3c2317' \
            'docs/FILECOIN_BOSS_HUMAN_SUMMARY_v0.1.md' \
            | sha256sum --check --strict

          rm -rf .summary-repair
          git rm .github/workflows/assemble-document-package.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize exact Filecoin Boss document package"
          git push
