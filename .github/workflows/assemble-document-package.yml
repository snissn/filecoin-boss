name: Assemble Filecoin Boss document package

on:
  push:
    paths:
      - ".doc-staging/READY"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble exact source documents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/archive

          decode_document() {
            local source_dir="$1"
            local target="$2"
            cat ".doc-staging/${source_dir}"/*.b64part | base64 --decode | gzip --decompress > "$target"
          }

          decode_document spec docs/FILECOIN_BOSS_SPEC_v0.2.md
          decode_document impl docs/FILECOIN_BOSS_IMPLEMENTATION_DRAFT_v0.1.md
          decode_document api docs/FILECOIN_BOSS_API_AND_EVENT_DRAFT_v0.1.md
          decode_document test docs/FILECOIN_BOSS_TEST_AND_ROLLOUT_PLAN_v0.1.md
          decode_document summary docs/FILECOIN_BOSS_HUMAN_SUMMARY_v0.1.md
          decode_document diff docs/FILECOIN_BOSS_SPEC_v0.1_to_v0.2.diff
          decode_document manifest docs/manifest.json
          decode_document archive docs/archive/FILECOIN_BOSS_SPEC_v0.1.md

          rm -rf .doc-staging

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: publish complete Filecoin Boss specification package"
          git push
