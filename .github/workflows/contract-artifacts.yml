name: Contract artifacts

on:
  push:
    branches: [main]
    paths:
      - src/**
      - scripts/generate-contract-artifacts.sh
      - packages/contracts/**
      - deployments/schema.json
      - .github/workflows/contract-artifacts.yml
  pull_request:
    branches: [main]
    paths:
      - src/**
      - scripts/generate-contract-artifacts.sh
      - packages/contracts/**
      - deployments/schema.json
      - .github/workflows/contract-artifacts.yml

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Filecoin Pay source lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C lib/filecoin-pay rev-parse HEAD)" = "04ded6af6c15c4b5d98545f393dc656004d4aede"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - name: Regenerate contract artifacts
        run: scripts/generate-contract-artifacts.sh

      - name: Reject artifact drift
        run: git diff --exit-code -- packages/contracts

      - name: Validate manifests
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schemaVersion == 1 and (.contracts | length == 10)' packages/contracts/artifacts.json >/dev/null
          jq -e '.type == "object" and (.required | index("chainId")) and (.required | index("contracts"))' deployments/schema.json >/dev/null
