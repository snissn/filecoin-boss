name: Diagnose A5 build once

on:
  push:
    branches:
      - gpt56/issue-7-fwss-pdp-resource-binding
    paths:
      - .github/diagnose-a5-once

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/issue-7-fwss-pdp-resource-binding
          fetch-depth: 0
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - name: Capture compiler diagnostics
        shell: bash
        run: |
          set +e
          forge build --sizes > .github/a5-build.txt 2>&1
          status=$?
          set -e
          printf '\nexit_status=%s\n' "$status" >> .github/a5-build.txt
          rm -f .github/diagnose-a5-once .github/workflows/diagnose-a5-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/a5-build.txt
          git add -A
          git commit -m "chore: capture A5 build diagnostics"
          git push origin HEAD:gpt56/issue-7-fwss-pdp-resource-binding
