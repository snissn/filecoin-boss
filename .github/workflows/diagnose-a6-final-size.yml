name: Diagnose final A6 size

on:
  push:
    branches:
      - gpt56/diagnostic-a6-final-size

permissions:
  contents: read

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Filecoin Pay source lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C lib/filecoin-pay rev-parse HEAD)" = "04ded6af6c15c4b5d98545f393dc656004d4aede"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv
