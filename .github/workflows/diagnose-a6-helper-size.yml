name: Diagnose A6 helper size

on:
  push:
    branches:
      - gpt56/diagnostic-a6-helper-size
    paths:
      - .github/a6-helper-size-diagnostic

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/diagnostic-a6-helper-size
          fetch-depth: 0
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - name: Apply helper consolidation
        run: python3 .github/diagnose-a6-helper-size.py

      - name: Format, build, and test
        shell: bash
        run: |
          set -euo pipefail
          forge fmt
          forge fmt --check
          forge build --sizes
          forge test -vvv

      - name: Commit diagnostic source for exact-tree inspection
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/a6-helper-size-diagnostic \
            .github/diagnose-a6-helper-size.py \
            .github/workflows/diagnose-a6-helper-size.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "diagnostic: consolidate capacity validity helpers"
          git push origin HEAD:gpt56/diagnostic-a6-helper-size
