name: Diagnose A6 optimizer runs 1

on:
  push:
    branches:
      - gpt56/diagnostic-a6-optimizer-runs-1

permissions:
  contents: read

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Filecoin Pay source lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C lib/filecoin-pay rev-parse HEAD)" = "04ded6af6c15c4b5d98545f393dc656004d4aede"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - name: Verify diagnostic compiler policy
        run: grep -q '^optimizer_runs = 1$' foundry.toml

      - name: Build and report sizes
        run: forge build --sizes

      - name: Run complete suite
        run: forge test -vvv
