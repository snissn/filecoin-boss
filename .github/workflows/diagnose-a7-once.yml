name: Diagnose A7 tests once

on:
  push:
    branches:
      - gpt56/issue-9-capped-metered-services
    paths:
      - .github/diagnose-a7-once

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/issue-9-capped-metered-services
          fetch-depth: 0
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - name: Capture test diagnostics
        shell: bash
        run: |
          set +e
          forge test -vvv > .github/a7-test.txt 2>&1
          status=$?
          set -e
          printf '\nexit_status=%s\n' "$status" >> .github/a7-test.txt
          rm -f .github/diagnose-a7-once .github/workflows/diagnose-a7-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/a7-test.txt
          git add -A
          git commit -m "chore: capture A7 test diagnostics"
          git push origin HEAD:gpt56/issue-9-capped-metered-services
