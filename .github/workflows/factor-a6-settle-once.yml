name: Factor A6 settlement once

on:
  push:
    branches:
      - gpt56/issue-8-pdp-capacity-pricing
    paths:
      - .github/a6-settle-factor

permissions:
  contents: write

jobs:
  factor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/issue-8-pdp-capacity-pricing
          fetch-depth: 0
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - name: Factor current-settlement guard
        run: python3 .github/factor-a6-settle.py

      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          forge fmt
          rm -f \
            .github/a6-settle-factor \
            .github/factor-a6-settle.py \
            .github/workflows/factor-a6-settle-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: share current-settlement guard"
          git push origin HEAD:gpt56/issue-8-pdp-capacity-pricing
