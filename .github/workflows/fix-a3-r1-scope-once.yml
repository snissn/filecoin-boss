name: Fix A3-R1 scope once

on:
  push:
    branches:
      - gpt56/issue-25-factory-creation-code-calldata
    paths:
      - .github/a3-r1-scope-fix

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/issue-25-factory-creation-code-calldata
          fetch-depth: 0
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - name: Preserve merged account-version semantics
        run: python3 .github/fix-a3-r1-scope.py

      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          forge fmt
          rm -f \
            .github/a3-r1-scope-fix \
            .github/fix-a3-r1-scope.py \
            .github/workflows/fix-a3-r1-scope-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve nonzero account versions"
          git push origin HEAD:gpt56/issue-25-factory-creation-code-calldata
