name: Fix A5 diagnostic once

on:
  push:
    branches:
      - gpt56/issue-7-fwss-pdp-resource-binding
    paths:
      - .github/fix-a5-once

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/issue-7-fwss-pdp-resource-binding
          fetch-depth: 0
          submodules: recursive

      - name: Fix non-constant payer fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("test/integration/FWSSResourceBinding.t.sol")
          text = path.read_text()
          line = "    address internal constant PAYER = address(this);\n"
          if text.count(line) != 1:
              raise SystemExit("payer constant anchor mismatch")
          text = text.replace(line, "")
          replacements = {
              "new BossAccount(PAYER,": "new BossAccount(address(this),",
              "address(0), PAYER, address(account), true": "address(0), address(this), address(account), true",
              "_setState(PAYER);": "_setState(address(this));",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"fixture anchor mismatch: {old!r}")
              text = text.replace(old, new)
          path.write_text(text)
          PY
          rm -f .github/a5-build.txt

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - run: forge fmt

      - name: Commit exact fix and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/fix-a5-once .github/workflows/fix-a5-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: use runtime payer address in A5 fixture"
          git push origin HEAD:gpt56/issue-7-fwss-pdp-resource-binding
