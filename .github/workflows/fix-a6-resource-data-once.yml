name: Fix A6 resource data once

on:
  push:
    branches:
      - gpt56/issue-8-pdp-capacity-pricing
    paths:
      - .github/a6-resource-data-fix

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/issue-8-pdp-capacity-pricing
          fetch-depth: 0
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - name: Remove unused capacity resource data
        run: python3 .github/fix-a6-resource-data.py

      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          forge fmt
          rm -f \
            .github/a6-resource-data-fix \
            .github/fix-a6-resource-data.py \
            .github/workflows/fix-a6-resource-data-once.yml \
            .github/reduce-a6-account-once \
            .github/reduce-a6-account.py \
            .github/workflows/reduce-a6-account-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: drop unused capacity resource data"
          git push origin HEAD:gpt56/issue-8-pdp-capacity-pricing
