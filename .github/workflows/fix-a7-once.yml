name: Fix A7 test sequencing once

on:
  push:
    branches:
      - gpt56/issue-9-capped-metered-services
    paths:
      - .github/fix-a7-once

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/issue-9-capped-metered-services
          fetch-depth: 0
          submodules: recursive

      - name: Date claims after subscription acceptance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("test/unit/BossUsageClaims.t.sol")
          text = path.read_text()
          replacements = {
              '''    function testClaimsAreBoundedBySingleWindowLifetimeAndBudgetCaps() public {
                  vm.roll(250);
                  (bytes32 subscriptionId, uint256 railId) = account.acceptOffer(_input(10 ether, 9 ether, 5 ether, 2 ether, 1));
          ''': '''    function testClaimsAreBoundedBySingleWindowLifetimeAndBudgetCaps() public {
                  (bytes32 subscriptionId, uint256 railId) = account.acceptOffer(_input(10 ether, 9 ether, 5 ether, 2 ether, 1));
                  vm.roll(250);
          ''',
              '''    function testReplayOverlapWrongReporterFutureAndCrossWindowClaimsFailClosed() public {
                  vm.roll(250);
                  (bytes32 subscriptionId,) = account.acceptOffer(_input(10 ether, 20 ether, 10 ether, 5 ether, 2));
          ''': '''    function testReplayOverlapWrongReporterFutureAndCrossWindowClaimsFailClosed() public {
                  (bytes32 subscriptionId,) = account.acceptOffer(_input(10 ether, 20 ether, 10 ether, 5 ether, 2));
                  vm.roll(250);
          ''',
              '''    function testZeroByteClaimIsConsumedWithoutPayment() public {
                  vm.roll(120);
                  (bytes32 subscriptionId, uint256 railId) = account.acceptOffer(_input(3 ether, 20 ether, 10 ether, 5 ether, 3));
          ''': '''    function testZeroByteClaimIsConsumedWithoutPayment() public {
                  (bytes32 subscriptionId, uint256 railId) = account.acceptOffer(_input(3 ether, 20 ether, 10 ether, 5 ether, 3));
                  vm.roll(120);
          ''',
              '''    function testOnlyOwnerCanTopUpAndTopUpCannotExceedAcceptedCap() public {
                  vm.roll(120);
                  (bytes32 subscriptionId, uint256 railId) = account.acceptOffer(_input(3 ether, 20 ether, 10 ether, 5 ether, 4));
          ''': '''    function testOnlyOwnerCanTopUpAndTopUpCannotExceedAcceptedCap() public {
                  (bytes32 subscriptionId, uint256 railId) = account.acceptOffer(_input(3 ether, 20 ether, 10 ether, 5 ether, 4));
                  vm.roll(120);
          ''',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"A7 sequence anchor mismatch: {old.splitlines()[0]}")
              text = text.replace(old, new)
          path.write_text(text)
          PY
          rm -f .github/a7-test.txt

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - run: forge fmt

      - name: Commit test correction and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/fix-a7-once .github/workflows/fix-a7-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: date usage claims after acceptance"
          git push origin HEAD:gpt56/issue-9-capped-metered-services
