name: Fix A8 registry fixture once

on:
  push:
    branches:
      - gpt56/issue-10-bundles-state-view-artifacts
    paths:
      - .github/a8-registry-fixture-fix

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/issue-10-bundles-state-view-artifacts
          fetch-depth: 0
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - name: Apply fixture repair
        run: python3 .github/fix-a8-registry-fixture.py

      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          forge fmt
          rm -f \
            .github/a8-registry-fixture-fix \
            .github/fix-a8-registry-fixture.py \
            .github/workflows/fix-a8-registry-fixture-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: register exact state-view adapters"
          git push origin HEAD:gpt56/issue-10-bundles-state-view-artifacts
