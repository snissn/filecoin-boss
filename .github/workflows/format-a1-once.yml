name: Format A1 once

on:
  push:
    branches:
      - gpt56/issue-3-types-hashes-interfaces
    paths:
      - .github/format-once

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/issue-3-types-hashes-interfaces
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - name: Format Solidity
        run: forge fmt

      - name: Commit formatted source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/format-once .github/workflows/format-a1-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: apply forge formatting"
          git push origin HEAD:gpt56/issue-3-types-hashes-interfaces
