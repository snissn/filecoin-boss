name: Format A8 once

on:
  push:
    branches:
      - gpt56/issue-10-bundles-state-view-artifacts
    paths:
      - .github/format-a8-once

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/issue-10-bundles-state-view-artifacts
          fetch-depth: 0
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - name: Format exact failing test
        run: forge fmt test/integration/EventReconstruction.t.sol

      - name: Commit formatting and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/format-a8-once .github/workflows/format-a8-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: format A8 event reconstruction test"
          git push origin HEAD:gpt56/issue-10-bundles-state-view-artifacts
