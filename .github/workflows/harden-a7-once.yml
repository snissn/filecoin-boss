name: Harden A7 adapter pinning once

on:
  push:
    branches:
      - gpt56/issue-9-capped-metered-services
    paths:
      - .github/harden-a7-once

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/issue-9-capped-metered-services
          fetch-depth: 0
          submodules: recursive

      - name: Pin runtime adapter code and avoid flat-service storage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"anchor mismatch ({count}): {old[:100]!r}")
              return text.replace(old, new)

          account = Path("src/BossAccount.sol")
          text = account.read_text()
          text = replace_once(
              text,
              "        _pricingDataBySubscription[subscriptionId] = input.pricingData;\n",
              "        if (offer.billingKind == BossTypes.BillingKind.METERED_FIXED_LOCKUP) {\n"
              "            _pricingDataBySubscription[subscriptionId] = input.pricingData;\n"
              "        }\n",
          )
          text = replace_once(
              text,
              "        uint256 rawGross = IBossPricingAdapter(subscription.pricingAdapter).quoteUsage(\n",
              "        _requirePinnedAdapterCode(subscription.pricingAdapter, BossTypes.AdapterKind.PRICING);\n"
              "        uint256 rawGross = IBossPricingAdapter(subscription.pricingAdapter).quoteUsage(\n",
          )
          helper = '''    function _requirePinnedAdapterCode(address adapter, BossTypes.AdapterKind kind) private view {
                  BossTypes.AdapterRecord memory record = BossAdapterRegistry(adapterRegistry).getAdapter(adapter);
                  if (
                      record.kind != kind || record.interfaceVersion != 1 || record.codeHash == bytes32(0)
                          || adapter.code.length == 0 || adapter.codehash != record.codeHash
                  ) revert InvalidAdapter(adapter, kind);
              }

          '''
          text = replace_once(
              text,
              "    function _validateCaps(\n",
              helper + "    function _validateCaps(\n",
          )
          account.write_text(text)

          test = Path("test/unit/BossUsageClaims.t.sol")
          text = test.read_text()
          text = replace_once(
              text,
              "    function sign(uint256 privateKey, bytes32 digest) external returns (uint8 v, bytes32 r, bytes32 s);\n",
              "    function sign(uint256 privateKey, bytes32 digest) external returns (uint8 v, bytes32 r, bytes32 s);\n"
              "    function etch(address target, bytes calldata newRuntimeBytecode) external;\n",
          )
          tests = '''    function testDisabledAcceptedPricingAdapterRemainsUsable() public {
                  (bytes32 subscriptionId,) = account.acceptOffer(_input(3 ether, 20 ether, 10 ether, 5 ether, 40));
                  adapterRegistry.setAdapterActive(address(pricingAdapter), false);
                  vm.roll(120);
                  BossTypes.UsageClaim memory claim = _claim(40, 100, 110, TIB / 10);
                  require(
                      account.submitUsageClaim(subscriptionId, claim, _signClaim(subscriptionId, claim)) != 0,
                      "accepted adapter disabled retroactively"
                  );
              }

              function testChangedPricingAdapterCodeFailsClosed() public {
                  (bytes32 subscriptionId,) = account.acceptOffer(_input(3 ether, 20 ether, 10 ether, 5 ether, 41));
                  vm.roll(120);
                  BossTypes.UsageClaim memory claim = _claim(41, 100, 110, TIB / 10);
                  bytes memory signature = _signClaim(subscriptionId, claim);
                  vm.etch(address(pricingAdapter), hex"00");
                  _mustFailClaim(subscriptionId, claim, signature);
              }

          '''
          text = replace_once(
              text,
              "    function testOnlyOwnerCanTopUpAndTopUpCannotExceedAcceptedCap() public {\n",
              tests + "    function testOnlyOwnerCanTopUpAndTopUpCannotExceedAcceptedCap() public {\n",
          )
          test.write_text(text)
          PY

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - run: forge fmt

      - name: Commit hardening and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/harden-a7-once .github/workflows/harden-a7-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce accepted metering adapter codehash"
          git push origin HEAD:gpt56/issue-9-capped-metered-services
