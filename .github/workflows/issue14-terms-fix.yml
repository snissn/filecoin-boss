name: Finalize Filone v1 terms pin

on:
  push:
    branches:
      - gpt56/issue-14-filone-pilot-release-evidence
    paths:
      - .github/workflows/issue14-terms-fix.yml

permissions:
  contents: write

concurrency:
  group: issue14-filone-terms-pin
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/issue-14-filone-pilot-release-evidence
          fetch-depth: 0
          submodules: recursive

      - name: Verify repaired protocol base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"
          test "$(git -C lib/filecoin-pay rev-parse HEAD)" = "04ded6af6c15c4b5d98545f393dc656004d4aede"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.3.5
          cache: true

      - name: Apply bounded terms invariant
        run: python3 .github/issue14-terms-fix.py

      - name: Qualify reference and contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile reference/filone/reference.py reference/filone/test_reference.py
          python3 -m unittest discover -s reference/filone -p 'test_*.py' -v
          forge fmt --check
          forge build --sizes
          forge test -vvv
          git diff --check

      - name: Publish clean candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/issue14-terms-fix.py .github/workflows/issue14-terms-fix.yml
          rm -rf reference/filone/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(reference): pin Filone v1 raw terms"
          git push origin HEAD:gpt56/issue-14-filone-pilot-release-evidence
