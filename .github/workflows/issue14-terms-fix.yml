name: Finalize A12 numeric policy

on:
  push:
    branches:
      - gpt56/issue-14-filone-pilot-release-evidence
    paths:
      - .github/workflows/issue14-terms-fix.yml

permissions:
  contents: write

concurrency:
  group: issue14-filone-terms-fix
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/issue-14-filone-pilot-release-evidence
          fetch-depth: 0
          submodules: recursive

      - name: Verify repaired protocol base
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"
          test "$(git -C lib/filecoin-pay rev-parse HEAD)" = "04ded6af6c15c4b5d98545f393dc656004d4aede"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.3.5
          cache: true

      - name: Publish numeric policy red test
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/issue14-review-red.py
          python3 -m py_compile reference/filone/test_reference.py
          git add reference/filone/test_reference.py
          git diff --cached --check
          git commit -m "test(reference): pin Filone v1 numeric terms"

      - name: Prove changed v1 terms are rejected only after repair
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 -m unittest discover -s reference/filone -p 'test_*.py' -v > /tmp/a12-terms-red.log 2>&1
          status=$?
          set -e
          cat /tmp/a12-terms-red.log
          test "$status" -ne 0
          grep -q 'test_product_policy_pins_numeric_v1_terms' /tmp/a12-terms-red.log

      - name: Apply fixed numeric policy
        run: python3 .github/issue14-terms-fix.py

      - name: Qualify exact source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile reference/filone/reference.py reference/filone/test_reference.py
          python3 -m unittest discover -s reference/filone -p 'test_*.py' -v
          forge fmt --check
          forge build --sizes
          forge test -vvv
          git diff --check

      - name: Publish clean candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/issue14-review-red.py \
            .github/issue14-terms-fix.py \
            .github/workflows/issue14-terms-fix.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(reference): pin Filone v1 numeric product terms"
          git push origin HEAD:gpt56/issue-14-filone-pilot-release-evidence
