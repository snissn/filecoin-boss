name: Finalize A6-R1 capacity assurance repair

on:
  push:
    branches:
      - gpt56/issue-33-capacity-assurance-decoupling
    paths:
      - .github/workflows/issue33-fix.yml

permissions:
  contents: write

concurrency:
  group: issue33-capacity-assurance
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/issue-33-capacity-assurance-decoupling
          fetch-depth: 0
          submodules: recursive

      - name: Verify Filecoin Pay source lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C lib/filecoin-pay rev-parse HEAD)" = "04ded6af6c15c4b5d98545f393dc656004d4aede"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.3.5
          cache: true

      - name: Apply bounded production repair
        run: python3 .github/issue33-fix.py

      - name: Format, build, and test
        shell: bash
        run: |
          set -euo pipefail
          forge fmt
          forge fmt --check
          forge build --sizes
          forge test -vvv

      - name: Regenerate deterministic contract package
        shell: bash
        run: |
          set -euo pipefail
          scripts/generate-contract-artifacts.sh
          git diff --check

      - name: Publish clean candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/issue33-fix.py .github/workflows/issue33-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(contracts): decouple capacity pricing from assurance"
          git push origin HEAD:gpt56/issue-33-capacity-assurance-decoupling
