name: Publish A6-R1 red candidate

on:
  push:
    branches:
      - gpt56/issue-33-capacity-assurance-decoupling
    paths:
      - .github/workflows/issue33-publish-red.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/issue-33-capacity-assurance-decoupling
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.3.5
          cache: true

      - name: Apply and format red tests
        run: |
          python3 .github/issue33-tests.py
          forge fmt test/integration/PDPCapacityLifecycle.t.sol

      - name: Publish tests-only commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/issue33-tests.py .github/workflows/issue33-publish-red.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(contracts): define cancellable capacity offer semantics"
          git push origin HEAD:gpt56/issue-33-capacity-assurance-decoupling
