name: Qualify A5 review fixes once

on:
  push:
    branches:
      - gpt56/issue-7-fwss-pdp-resource-binding
    paths:
      - .github/qualify-a5-review-once

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/issue-7-fwss-pdp-resource-binding
          fetch-depth: 0
          submodules: recursive

      - name: Restore canonical sibling test and format
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- test/unit/BossAccountFlatLifecycle.t.sol

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - run: forge fmt

      - name: Commit qualified review fixes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/qualify-a5-review-once .github/workflows/qualify-a5-review-once.yml
          git add -A
          git diff --cached --check
          git commit -m "fix: make FWSS dependency reads fail safe"
          git push origin HEAD:gpt56/issue-7-fwss-pdp-resource-binding
