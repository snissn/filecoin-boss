name: Simplify A6 quote validation once

on:
  push:
    branches:
      - gpt56/issue-8-pdp-capacity-pricing
    paths:
      - .github/a6-quote-validation-fix

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/issue-8-pdp-capacity-pricing
          fetch-depth: 0
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - name: Simplify capacity quote invariant
        run: python3 .github/simplify-a6-quote-validation.py

      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          forge fmt
          rm -f \
            .github/a6-quote-validation-fix \
            .github/simplify-a6-quote-validation.py \
            .github/workflows/simplify-a6-quote-validation-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: simplify capacity quote invariant"
          git push origin HEAD:gpt56/issue-8-pdp-capacity-pricing
