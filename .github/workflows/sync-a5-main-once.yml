name: Sync A5 to current main once

on:
  push:
    branches:
      - gpt56/issue-7-fwss-pdp-resource-binding
    paths:
      - .github/sync-a5-main-once

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/issue-7-fwss-pdp-resource-binding
          fetch-depth: 0
          submodules: recursive

      - name: Merge current main and restore canonical context guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main
          python - <<'PY'
          from pathlib import Path

          path = Path("src/BossAccount.sol")
          text = path.read_text()
          old = "                || input.resource.anchor == address(0)\n"
          new = "                || input.resource.anchor == address(0) || input.resource.context != bytes32(0)\n"
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f"context guard anchor count: {text.count(old)}")
              text = text.replace(old, new)
              path.write_text(text)
          PY

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
          cache: true

      - run: forge fmt

      - name: Commit synchronized candidate and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/sync-a5-main-once .github/workflows/sync-a5-main-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve canonical FWSS resource context"
          git push origin HEAD:gpt56/issue-7-fwss-pdp-resource-binding
